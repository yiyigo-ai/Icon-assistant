<!DOCTYPE html>
<html>
<head>
  <title>测试通义万相API CORS</title>
</head>
<body>
  <h1>测试通义万相API CORS（通过Vite代理）</h1>
  <button onclick="testAPI()">测试API调用</button>
  <pre id="result"></pre>

  <h2>生成的图片：</h2>
  <img id="generatedImage" style="max-width: 300px; border: 1px solid #ccc;">

  <script>
    const API_KEY = 'sk-28e5c595a4cc486680ad0ce824e98fd2';

    async function testAPI() {
      const resultEl = document.getElementById('result');
      const imgEl = document.getElementById('generatedImage');

      try {
        resultEl.textContent = '正在调用API（通过Vite代理）...';

        // 1. 创建生成任务 - 使用代理路径
        const createResponse = await fetch('/api/dashscope/services/aigc/text2image/image-synthesis', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_KEY}`,
            'Content-Type': 'application/json',
            'X-DashScope-Async': 'enable'
          },
          body: JSON.stringify({
            model: 'wanx-v1',
            input: {
              prompt: 'a simple shoe icon, flat design, minimalist style, white background, transparent background'
            },
            parameters: {
              style: '<auto>',
              size: '1024*1024',
              n: 1
            }
          })
        });

        const createData = await createResponse.json();
        resultEl.textContent = '创建任务响应:\n' + JSON.stringify(createData, null, 2);

        if (!createData.output?.task_id) {
          throw new Error('创建任务失败: ' + JSON.stringify(createData));
        }

        const taskId = createData.output.task_id;

        // 2. 轮询查询任务状态 - 使用代理路径
        let attempts = 0;
        const maxAttempts = 30;

        while (attempts < maxAttempts) {
          await new Promise(r => setTimeout(r, 2000));
          attempts++;

          const queryResponse = await fetch(`/api/dashscope/tasks/${taskId}`, {
            headers: {
              'Authorization': `Bearer ${API_KEY}`
            }
          });

          const queryData = await queryResponse.json();

          if (queryData.output.task_status === 'SUCCEEDED') {
            resultEl.textContent = '生成成功!\n' + JSON.stringify(queryData, null, 2);
            imgEl.src = queryData.output.results[0].url;
            break;
          } else if (queryData.output.task_status === 'FAILED') {
            throw new Error('生成失败: ' + JSON.stringify(queryData));
          } else {
            resultEl.textContent = `任务状态: ${queryData.output.task_status} (尝试 ${attempts}/${maxAttempts})`;
          }
        }

      } catch (error) {
        resultEl.textContent = '错误: ' + error.message + '\n\n' + error.stack;
        console.error(error);
      }
    }
  </script>
</body>
</html>
